<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doko · Kasse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doko">
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F2F2F7;--surface3:#E5E5EA;
  --primary:#007AFF;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--red:#FF3B30;--green:#34C759;--orange:#FF9500;
  --r:12px;--r-sm:8px;--sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--surface3:#3A3A3C;
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.25);
  --sep:rgba(84,84,88,.55);
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--label);min-height:100dvh;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}

/* NAV */
.nav{position:sticky;top:0;z-index:90;background:rgba(242,242,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--sep);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
@media(prefers-color-scheme:dark){.nav{background:rgba(28,28,30,.88)}}
.nav h1{flex:1;font-size:17px;font-weight:600;text-align:center}
.nav-back{font-size:15px;font-weight:500;color:var(--primary);cursor:pointer;padding:4px 0;white-space:nowrap}
.nav-action{font-size:15px;font-weight:600;color:var(--primary);cursor:pointer;white-space:nowrap}

/* CARDS */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.section{margin:0 16px 16px}
.section-label{font-size:12.5px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:8px}
.row{display:flex;align-items:center;padding:13px 16px;gap:12px;border-bottom:1px solid var(--sep)}
.row:last-child{border-bottom:none}
.row-label{flex:1;font-size:17px}
.row-sub{font-size:13px;color:var(--label2);margin-top:1px}
.row-value{font-size:17px;color:var(--label2)}
.row-chevron{color:var(--label3);font-size:15px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 20px;border-radius:999px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:opacity .12s,transform .1s;text-decoration:none;letter-spacing:-.01em}
.btn:active{opacity:.72;transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--label)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:8px 16px;font-size:15px;border-radius:999px}
.btn-full{width:100%}
.btn:disabled{opacity:.38;pointer-events:none}

/* SCORE DISPLAY */
.pts{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.pts.pos{color:var(--green)}.pts.neg{color:var(--red)}.pts.zero{color:var(--label2)}

/* SCOREBOARD */
.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:16px}
.sb-player{display:flex;flex-direction:column;align-items:center;gap:5px}
.sb-name{font-size:11px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
.sb-pts{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}

/* BOCK BADGE */
.bock-chip{display:inline-flex;align-items:center;gap:5px;background:var(--orange);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.bock-chip.dbl{background:var(--red)}

/* TABLE VIZ */
.table-wrap{position:relative;width:220px;height:220px;margin:8px auto}
.table-felt{position:absolute;inset:40px;border-radius:50%;background:var(--surface2);border:2px solid var(--sep)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;width:70px}
.seat.S{bottom:0;left:50%;transform:translateX(-50%)}
.seat.W{left:0;top:50%;transform:translateY(-50%)}
.seat.N{top:0;left:50%;transform:translateX(-50%)}
.seat.O{right:0;top:50%;transform:translateY(-50%)}
.seat-chip{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:var(--surface3);color:var(--label)}
.seat-chip.dealer{background:var(--orange);color:#fff}
.seat-label{font-size:10px;color:var(--label2);font-weight:600}

/* SHEET */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:94dvh;overflow-y:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.sheet-handle{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:12px auto 2px}
.sheet-title{font-size:20px;font-weight:700;padding:8px 20px 20px}

/* FORM */
.f-section{padding:0 20px 20px}
.f-label{font-size:12.5px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.f-hint{font-size:13px;color:var(--label2);margin-bottom:12px;line-height:1.4}

/* SEGMENTED */
.seg{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg-btn{flex:1;padding:8px 6px;border:none;background:transparent;border-radius:6px;font-size:14px;font-weight:500;color:var(--label2);cursor:pointer;transition:all .15s;text-align:center}
.seg-btn.on{background:var(--surface);color:var(--label);font-weight:700;box-shadow:var(--sh)}

/* PLAYER GRID */
.p-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.p-btn{padding:14px 8px;border:2px solid var(--sep);border-radius:var(--r-sm);background:var(--surface);color:var(--label);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;line-height:1.3}
.p-btn:active{transform:scale(.96)}
.p-btn.re{border-color:var(--primary);background:rgba(0,122,255,.1);color:var(--primary)}
.p-btn.ko{border-color:var(--red);background:rgba(255,59,48,.1);color:var(--red)}
.p-btn.sel-neg{border-color:var(--red);background:rgba(255,59,48,.1);color:var(--red)}

/* NUMBER INPUT */
.num-input{width:100%;padding:14px;border:1.5px solid var(--sep);border-radius:var(--r-sm);font-size:32px;font-weight:800;text-align:center;color:var(--label);background:var(--surface);font-variant-numeric:tabular-nums}
.num-input:focus{outline:none;border-color:var(--primary)}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* TOGGLE */
.t-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep);gap:12px}
.t-row:last-child{border-bottom:none}
.t-lbl{flex:1;font-size:17px;line-height:1.3}
.toggle{position:relative;width:51px;height:31px;flex-shrink:0;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.t-track{position:absolute;inset:0;border-radius:999px;background:var(--sep);transition:background .2s;cursor:pointer}
.toggle input:checked+.t-track{background:var(--green)}
.t-track::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.28);transition:transform .2s}
.toggle input:checked+.t-track::after{transform:translateX(20px)}

/* SPECIAL POINTS */
.sp-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--sep);gap:10px}
.sp-row:last-child{border-bottom:none}
.sp-name{flex:1;font-size:16px}
.sp-btns{display:flex;gap:5px}
.sp-btn{padding:6px 12px;border:1.5px solid var(--sep);border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--label2);transition:all .12s}
.sp-btn.re{border-color:var(--primary);background:rgba(0,122,255,.1);color:var(--primary)}
.sp-btn.ko{border-color:var(--red);background:rgba(255,59,48,.1);color:var(--red)}

/* PREVIEW */
.preview{background:var(--surface2);border-radius:var(--r);padding:14px 16px}
.preview-row{display:flex;align-items:center;padding:5px 0}
.preview-name{flex:1;font-size:16px;font-weight:600}
.preview-pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}

/* GAME LIST ITEM */
.g-wrap{position:relative;overflow:hidden}
.g-wrap:last-child .g-item{border-bottom:none}
.g-item{display:flex;padding:11px 16px;gap:10px;align-items:center;border-bottom:1px solid var(--sep);background:var(--surface);will-change:transform;position:relative;z-index:1}
.g-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--red);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em;z-index:0}
.g-num{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--label2);flex-shrink:0}
.g-info{flex:1;min-width:0}
.g-type{font-size:15px;font-weight:600}
.g-sub{font-size:12px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-badge{font-size:13px;font-weight:700;text-align:right;flex-shrink:0}

/* FAB */
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 480px)/2 + 20px));width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,122,255,.42);transition:transform .1s,box-shadow .1s;z-index:100;line-height:1}
.fab:active{transform:scale(.9);box-shadow:0 2px 8px rgba(0,122,255,.35)}

/* MISC */
.empty{text-align:center;padding:56px 20px;color:var(--label2)}
.empty-icon{font-size:52px;margin-bottom:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.pt16{padding-top:16px}
.kasse-amt{font-size:54px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill-green{background:rgba(52,199,89,.15);color:var(--green)}
.pill-red{background:rgba(255,59,48,.15);color:var(--red)}
.pill-orange{background:rgba(255,149,0,.15);color:var(--orange)}

/* SPIELTYP GRID */
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-btn{padding:10px 6px;border:1.5px solid var(--sep);border-radius:var(--r-sm);background:var(--surface);color:var(--label);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.st-btn.on{border-color:var(--primary);background:rgba(0,122,255,.1);color:var(--primary)}
.st-btn.special{border-color:var(--red)}
.st-btn.special.on{border-color:var(--red);background:rgba(255,59,48,.1);color:var(--red)}

/* DIVIDER */
.divider{height:1px;background:var(--sep);margin:0}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════

const PL = {
  gee:   {id:'gee',   name:'Gerald',    s:'Gee'},
  chrizz:{id:'chrizz',name:'Christian', s:'Chrizz'},
  freed: {id:'freed', name:'Andreas',   s:'Free-D'},
  mjd:   {id:'mjd',   name:'Michael',   s:'MJD'},
};
const PIDS = ['gee','chrizz','freed','mjd'];

const ST = {
  normal:     {l:'Normalspiel',   solo:false, special:false},
  hochzeit:   {l:'Hochzeit',      solo:false, special:false},
  armut:      {l:'Armut',         solo:false, special:false},
  solo_buben: {l:'Bubensolo',     solo:true,  special:false},
  solo_damen: {l:'Damensolo',     solo:true,  special:false},
  solo_farbe: {l:'Farbensolo',    solo:true,  special:false},
  fleischlos: {l:'Fleischloser',  solo:true,  special:false},
  falsch:     {l:'Falsch bedient',solo:false, special:true},
  abbruch:    {l:'Spielabbruch',  solo:false, special:true},
};
const SOLOS = ['solo_buben','solo_damen','solo_farbe','fleischlos'];

// Which Sonderpunkte are available per Spieltyp
const SP_AVAIL = {
  normal:     {fuchs:true,  karlchen:true,  dk:true},
  hochzeit:   {fuchs:true,  karlchen:true,  dk:true},
  armut:      {fuchs:true,  karlchen:true,  dk:true},
  solo_buben: {fuchs:false, karlchen:false, dk:true},
  solo_damen: {fuchs:true,  karlchen:false, dk:true},
  solo_farbe: {fuchs:true,  karlchen:false, dk:true},
  fleischlos: {fuchs:false, karlchen:false, dk:true},
  falsch:     {fuchs:false, karlchen:false, dk:false},
  abbruch:    {fuchs:false, karlchen:false, dk:false},
};

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════

let S = (() => {
  try { const r = localStorage.getItem('doko-v3'); if(r) return JSON.parse(r); } catch(e){}
  return {kasseSaldo:0, sessions:[], currentId:null};
})();

const save = () => localStorage.setItem('doko-v3', JSON.stringify(S));
const getCur = () => S.sessions.find(s => s.id === S.currentId) || null;

// ═══════════════════════════════════════════════
// SCORING ENGINE
// ═══════════════════════════════════════════════

function calcScores(g) {
  // Falsch bedient
  if (g.spieltyp === 'falsch') {
    const sc = {};
    PIDS.forEach(p => sc[p] = g.falschBediener === p ? -21 : 7);
    return sc;
  }
  // Spielabbruch
  if (g.spieltyp === 'abbruch') {
    const sc = {}; PIDS.forEach(p => sc[p] = 0); return sc;
  }

  const isSolo = SOLOS.includes(g.spieltyp);
  const {reTeam, kontraTeam, winner, verliererAugen, ansagen, sonderpunkte, bockMultiplier} = g;

  // Base points
  let pts = 1;
  if (verliererAugen < 90) pts++;
  if (verliererAugen < 60) pts++;
  if (verliererAugen < 30) pts++;
  if (verliererAugen === 0) pts++;    // Schwarz (zusätzlich zu <30)

  // Ansagen
  if (ansagen.re) pts++;
  if (ansagen.kontra) pts++;

  // Winner's own extra Ansagen
  const ws = winner; // 'Re' or 'Kontra'
  const ls = ws === 'Re' ? 'Kontra' : 'Re';
  ['keine90','keine60','keine30','schwarz'].forEach(a => {
    if (ansagen[a + ws]) pts++;   // Winner announced & achieved
    if (ansagen[a + ls]) pts++;   // Loser announced but still lost → winner gets point
  });

  // Bock
  pts *= bockMultiplier;

  // Distribute — bilateral: each player settles against each opponent individually
  const sc = {};
  [...reTeam, ...kontraTeam].forEach(p => sc[p] = 0);
  const winTeam = ws === 'Re' ? reTeam : kontraTeam;
  const loseTeam = ws === 'Re' ? kontraTeam : reTeam;

  if (isSolo) {
    // Solo (1 vs 3): solo player settles against 3 opponents
    const solo = reTeam[0];
    if (ws === 'Re') {
      sc[solo] = pts * kontraTeam.length;   // +3×pts
      kontraTeam.forEach(p => sc[p] = -pts); // each pays 1×pts
    } else {
      sc[solo] = -pts * kontraTeam.length;
      kontraTeam.forEach(p => sc[p] = pts);
    }
  } else {
    // Normal (2 vs 2): each winner settles against each loser → ×2 per player
    winTeam.forEach(p => sc[p] = pts * loseTeam.length);
    loseTeam.forEach(p => sc[p] = -pts * winTeam.length);
  }

  // Sonderpunkte (bilateral too)
  const sp = g.sp || {};
  const applySpPts = (countRe, countKo) => {
    const v = bockMultiplier;
    if (isSolo) {
      const solo = reTeam[0];
      sc[solo] += (countRe - countKo) * v * kontraTeam.length;
      kontraTeam.forEach(p => sc[p] += (countKo - countRe) * v);
    } else {
      reTeam.forEach(p => sc[p] += (countRe - countKo) * v * kontraTeam.length);
      kontraTeam.forEach(p => sc[p] += (countKo - countRe) * v * reTeam.length);
    }
  };
  if (sp.fuchsRe || sp.fuchsKo) applySpPts(sp.fuchsRe||0, sp.fuchsKo||0);
  if (sp.karlchen) applySpPts(sp.karlchen==='Re'?1:0, sp.karlchen==='Kontra'?1:0);
  if (sp.dkRe || sp.dkKo) applySpPts(sp.dkRe||0, sp.dkKo||0);

  return sc;
}

function calcBreakdown(g) {
  if (g.spieltyp === 'falsch') return {lines:[{label:'Falsch bedient',pts:null}], basePts:null, bockMultiplier:1, isSolo:false};
  if (g.spieltyp === 'abbruch') return {lines:[{label:'Spielabbruch — 0 Punkte',pts:null}], basePts:null, bockMultiplier:1, isSolo:false};

  const isSolo = SOLOS.includes(g.spieltyp);
  const {verliererAugen, ansagen, bockMultiplier, winner} = g;
  const ws = winner;
  const ls = ws === 'Re' ? 'Kontra' : 'Re';

  const lines = [];
  let pts = 1;
  lines.push({label:'Gewonnen', pts:1});

  if (verliererAugen < 90) { pts++; lines.push({label:`Verlierer < 90 (${verliererAugen} Augen)`, pts:1}); }
  if (verliererAugen < 60) { pts++; lines.push({label:'Verlierer < 60', pts:1}); }
  if (verliererAugen < 30) { pts++; lines.push({label:'Verlierer < 30', pts:1}); }
  if (verliererAugen === 0) { pts++; lines.push({label:'Schwarz (0 Augen)', pts:1}); }

  if (ansagen.re)     { pts++; lines.push({label:'Re angesagt', pts:1}); }
  if (ansagen.kontra) { pts++; lines.push({label:'Kontra angesagt', pts:1}); }

  const annLabels = {keine90:'Keine 90', keine60:'Keine 60', keine30:'Keine 30', schwarz:'Schwarz'};
  ['keine90','keine60','keine30','schwarz'].forEach(a => {
    if (ansagen[a+ws]) { pts++; lines.push({label:`${annLabels[a]} ${ws} (angesagt & erfüllt)`, pts:1}); }
    if (ansagen[a+ls]) { pts++; lines.push({label:`${annLabels[a]} ${ls} (angesagt, nicht erfüllt)`, pts:1}); }
  });

  return {lines, basePts: pts, bockMultiplier, isSolo};
}

function sessionTotals(ses) {
  const t = {}; PIDS.forEach(p => t[p] = 0);
  (ses.games || []).forEach(g => Object.entries(g.scores).forEach(([p,v]) => t[p] = (t[p]||0)+v));
  return t;
}

function kasseBeitrag(totals, soloStrafe) {
  const max = Math.max(...PIDS.map(p => totals[p] || 0));
  const b = {};
  PIDS.forEach(p => {
    let e = Math.round(Math.min(Math.max(max - (totals[p] || 0), 0) / 10, 10));
    if (soloStrafe?.[p]) e += 5;
    b[p] = e;
  });
  return b;
}

// ═══════════════════════════════════════════════
// BOCK MANAGEMENT
// ═══════════════════════════════════════════════

function nextBockMult(ses) {
  const idx = ses.games.length;
  if (!ses.bockQ) return 1;
  const count = ses.bockQ.filter(i => i === idx).length;
  if (count >= 2) return 4; // Doppelbock
  if (count === 1) return 2; // Bock
  return 1;
}

function scheduleBock(ses, delay) {
  if (!ses.bockQ) ses.bockQ = [];
  const target = ses.games.length + (delay || 0);
  ses.bockQ.push(target);
}

function checkBockTriggers(ses, game) {
  // 1. Zero-sum game (net |points| = 0)
  const absSum = Object.values(game.scores).reduce((a,b) => a + Math.abs(b), 0);
  if (absSum === 0) scheduleBock(ses, 0);

  // 2. Spielabbruch
  if (game.spieltyp === 'abbruch') scheduleBock(ses, 0);

  // 3. Spread ≥ 120 at end of Runde (every 4 games)
  if (ses.games.length % 4 === 0) {
    const t = sessionTotals(ses);
    const vals = PIDS.map(p => t[p]);
    const spread = Math.max(...vals) - Math.min(...vals);
    if (spread >= 120) {
      // Delay by 1 to avoid consecutive Bock
      const nextIdx = ses.games.length;
      const alreadyNext = ses.bockQ && ses.bockQ.includes(nextIdx);
      scheduleBock(ses, alreadyNext ? 1 : 0);
    }
  }
}

function recalcBockQ(ses) {
  const tempSes = {games: [], bockQ: []};
  ses.games.forEach(g => {
    tempSes.games.push(g);
    checkBockTriggers(tempSes, g);
  });
  ses.bockQ = tempSes.bockQ;
}

function recalcDealerIdx(ses) {
  ses.dealerIdx = 0;
  ses.games.forEach(g => {
    if (!SOLOS.includes(g.spieltyp)) ses.dealerIdx = (ses.dealerIdx + 1) % 4;
  });
}

function deleteGame(gameId) {

const PW_HASH = 'd49153f37d93f6a05b97bff92f0f904fa8f5ec7faf11599d615d9f2670cf3401';
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPw() {
  const v = (document.getElementById('pw-input')?.value || '').toLowerCase().trim();
  const h = await sha256(v);
  if (h === PW_HASH) {
    authenticated = true;
    sessionStorage.setItem('doko-auth', '1');
    render();
  } else {
    document.getElementById('pw-err').textContent = 'Falsches Passwort';
    const inp = document.getElementById('pw-input');
    if (inp) { inp.value = ''; inp.focus(); }
  }
}

function goBack() {
  if (document.querySelector('.overlay.open')) return; // sheet offen → kein back
  if (view !== 'home') go('home');
}

function swipeDeleteGame(gameId) {
  // Snap item back first, then confirm
  const wrap = document.querySelector(`.g-wrap[data-gid="${gameId}"]`);
  const item = wrap?.querySelector('.g-item');
  if (item) { item.style.transition = 'transform .15s ease'; item.style.transform = ''; }
  setTimeout(() => deleteGame(gameId), 160);
}

function closeAllGameSwipes() {
  document.querySelectorAll('.g-wrap .g-item').forEach(el => {
    el.style.transition = 'transform .2s ease'; el.style.transform = '';
  });
}

function initSwipes() {
  let bsX = null, bsY = null;       // back-swipe start
  let gs = null;                      // game-swipe state

  document.addEventListener('touchstart', e => {
    const t = e.touches[0];

    // Back swipe: finger starts in left 40px
    if (t.clientX < 40 && view !== 'home') { bsX = t.clientX; bsY = t.clientY; }

    // Game item swipe
    const wrap = e.target.closest('.g-wrap');
    if (wrap) {
      gs = { wrap, item: wrap.querySelector('.g-item'), x0: t.clientX, y0: t.clientY, dx: 0, axis: null };
    } else if (!e.target.closest('.g-del')) {
      closeAllGameSwipes();
    }
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if (!gs) return;
    const t = e.touches[0];
    const dx = t.clientX - gs.x0;
    const dy = t.clientY - gs.y0;
    if (!gs.axis && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      gs.axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (gs.axis === 'h') {
      e.preventDefault();
      const clamped = Math.max(-80, Math.min(0, dx));
      gs.dx = clamped;
      gs.item.style.transition = 'none';
      gs.item.style.transform = `translateX(${clamped}px)`;
    }
  }, {passive: false});

  document.addEventListener('touchend', e => {
    // Back swipe
    if (bsX !== null) {
      const t = e.changedTouches[0];
      if (t.clientX - bsX > 80 && Math.abs(t.clientY - bsY) < 80) goBack();
      bsX = null;
    }
    // Game swipe
    if (gs) {
      if (gs.dx < -50) {
        gs.item.style.transition = 'transform .18s ease';
        gs.item.style.transform = 'translateX(-80px)';
      } else {
        gs.item.style.transition = 'transform .18s ease';
        gs.item.style.transform = '';
      }
      gs = null;
    }
  }, {passive: true});
}

function render() {
  if (!authenticated) { renderLock(); return; }
  try {
    const app = document.getElementById('app');
    app.innerHTML = ({
      home:          renderHome,
      session:       renderSession,
      history:       renderHistory,
      sessionDetail: renderSessionDetail,
      stats:         renderStats,
    }[view] || renderHome)();
    window.scrollTo(0, 0);
  } catch(e) {
    console.error('render error:', e);
    view = 'home';
    document.getElementById('app').innerHTML = renderHome();
  }
}

        <div style="font-size:12px;color:var(--label2);margin:8px 0 6px">Verlierer (${ls}) Ansagen die nicht erfüllt wurden</div>
        <div class="card" style="padding:0 14px">
          ${tRow(`ansagen.keine90${ls}`, g.ansagen[`keine90${ls}`], `Keine 90 (${ls})`)}
          ${tRow(`ansagen.keine60${ls}`, g.ansagen[`keine60${ls}`], `Keine 60 (${ls})`)}
          ${tRow(`ansagen.keine30${ls}`, g.ansagen[`keine30${ls}`], `Keine 30 (${ls})`)}
          ${tRow(`ansagen.schwarz${ls}`, g.ansagen[`schwarz${ls}`], `Schwarz (${ls})`)}
        </div>
      </div>`;

      const avail = SP_AVAIL[g.spieltyp] || {};
      const ctr = (key, max, label) => {
        const v = g.sp[key]||0;
        return `<div class="sp-row">
          <div class="sp-name">${label}</div>
          <div class="sp-btns">
            <button class="sp-btn" onclick="geSpDec('${key}')" ${v<=0?'disabled style="opacity:.3"':''}>−</button>
            <span style="min-width:22px;text-align:center;font-size:16px;font-weight:700;color:${v>0?'var(--primary)':'var(--label2)'}">${v}</span>
            <button class="sp-btn" onclick="geSpInc('${key}',${max})">+</button>
          </div>
        </div>`;
      };
      html += `<div class="f-section">
        <div class="f-label">Sonderpunkte</div>
        <div class="card" style="padding:0 14px">
          ${avail.fuchs ? ctr('fuchsRe',2,'🦊 Fuchs Re fängt') : ''}
          ${avail.fuchs ? ctr('fuchsKo',2,'🦊 Fuchs Kontra fängt') : ''}
          ${avail.karlchen ? `<div class="sp-row">
            <div class="sp-name">👑 Karlchen (letzter Stich)</div>
            <div class="sp-btns">
              <button class="sp-btn${g.sp.karlchen==='Re'?' re':''}" onclick="geSpKarlchen('Re')">Re</button>
              <button class="sp-btn${g.sp.karlchen==='Kontra'?' ko':''}" onclick="geSpKarlchen('Kontra')">Ko</button>
              ${g.sp.karlchen?`<button class="sp-btn" onclick="geSpKarlchen(null)">✕</button>`:''}
            </div>
          </div>` : ''}
          ${avail.dk ? ctr('dkRe',4,'♣️ Doppelkopf Re') : ''}
          ${avail.dk ? ctr('dkKo',4,'♣️ Doppelkopf Kontra') : ''}
          ${!avail.fuchs && !avail.karlchen && !avail.dk ? '<div style="padding:12px 0;color:var(--label2);font-size:14px">Keine Sonderpunkte bei diesem Spieltyp</div>' : ''}
        </div>
      </div>`;
    }
  }

  // BOCK
  html += `<div class="f-section">
    <div class="f-label">Bockrunde</div>
    <div class="seg">
      <button class="seg-btn${g.bockMultiplier===1?' on':''}" onclick="geSetBock(1)">Normal</button>
      <button class="seg-btn${g.bockMultiplier===2?' on':''}" onclick="geSetBock(2)">🔥 Bock</button>
      <button class="seg-btn${g.bockMultiplier===4?' on':''}" onclick="geSetBock(4)">⚡ Doppelbock</button>
    </div>
  </div>`;

  // PREVIEW
  if (scores) {
    const relevant = g.spieltyp === 'falsch' || g.spieltyp === 'abbruch' ? PIDS :
      [...g.reTeam, ...g.kontraTeam];
    const bd = calcBreakdown(g);
    const isSolo = SOLOS.includes(g.spieltyp);
    const bilateralMult = isSolo ? 3 : 2;

    let breakdownHTML = '';
    if (bd.basePts != null) {
      breakdownHTML = `<div style="margin-bottom:12px;padding:10px 12px;background:var(--surface3);border-radius:var(--r-sm);font-size:13px;line-height:1.7">
        ${bd.lines.map(l => `<div style="display:flex;justify-content:space-between;gap:8px">
          <span style="color:var(--label2)">${l.label}</span>
          <span style="font-weight:700;color:var(--label)">+${l.pts}</span>
        </div>`).join('')}
        ${bd.bockMultiplier > 1 ? `<div style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--sep);margin-top:4px;padding-top:4px">
          <span style="color:var(--label2)">× Bock (${bd.bockMultiplier}×)</span>
          <span style="font-weight:700;color:var(--orange)">= ${bd.basePts * bd.bockMultiplier}</span>
        </div>` : `<div style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--sep);margin-top:4px;padding-top:4px">
          <span style="color:var(--label2);font-weight:700">Spielwert</span>
          <span style="font-weight:800;color:var(--label)">${bd.basePts}</span>
        </div>`}
        <div style="display:flex;justify-content:space-between;gap:8px">
          <span style="color:var(--label2)">Bilateral (${isSolo?'1v3':'2v2'} → ×${bilateralMult} pro Spieler)</span>
          <span style="font-weight:700;color:var(--primary)">×${bilateralMult}</span>
        </div>
      </div>`;
    }

    html += `<div class="f-section">
      <div class="f-label">Punkte-Vorschau</div>
      ${breakdownHTML}
      <div class="preview">
        ${relevant.map(p => {
          const v = scores[p] || 0;
          const color = v>0?'var(--green)':v<0?'var(--red)':'var(--label2)';
          const side = g.reTeam.includes(p) ? 'Re' : 'Kontra';
          return `<div class="preview-row">
            <div class="preview-name">${PL[p].s} <span style="font-size:12px;font-weight:500;color:var(--label2)">${side}</span></div>
            <div class="preview-pts" style="color:${color}">${v>0?'+':''}${v}</div>
          </div>`;
        }).join('')}
      </div>

  }

  // SUBMIT
  const ok = geValid();
  html += `<div class="f-section">
    <button class="btn btn-primary btn-full" ${ok?'':'disabled'} onclick="geSubmit()">Spiel speichern</button>
    <button class="btn btn-secondary btn-full mt8" onclick="closeSheet('ge-sheet')">Abbrechen</button>
  </div>`;

  document.getElementById('ge-body').innerHTML = html;
}

function tRow(key, val, label) {
  return `<div class="t-row">
    <div class="t-lbl">${label}</div>
    <label class="toggle">
      <input type="checkbox" ${val?'checked':''} onchange="geToggle('${key}',this.checked)">
      <div class="t-track"></div>
    </label>
  </div>`;
}


// GE actions
const geSetType = t => { GE.spieltyp=t; GE.reTeam=[]; GE.kontraTeam=[]; GE.winner=null; GE.falschBediener=null; updateGE(); };
const geSetFalsch = p => { GE.falschBediener=p; updateGE(); };
const geSetWinner = w => { GE.winner=w; updateGE(); };
const geSetAugen = v => { GE.verliererAugen=Math.max(0,Math.min(119,parseInt(v)||0)); updateGE(); };
const geSetBock = v => { GE.bockMultiplier=v; updateGE(); };
const geSpInc = (k,max) => { GE.sp[k]=Math.min(max,(GE.sp[k]||0)+1); updateGE(); };
const geSpDec = k => { GE.sp[k]=Math.max(0,(GE.sp[k]||0)-1); updateGE(); };
const geSpKarlchen = v => { GE.sp.karlchen = GE.sp.karlchen===v ? null : v; updateGE(); };

function geToggleRe(pid) {
  const g = GE;
  const isSolo = SOLOS.includes(g.spieltyp);
  const maxRe = isSolo ? 1 : 2;
  if (g.reTeam.includes(pid)) { g.reTeam=g.reTeam.filter(p=>p!==pid); g.kontraTeam=g.kontraTeam.filter(p=>p!==pid); }
  else if (g.kontraTeam.includes(pid)) { g.kontraTeam=g.kontraTeam.filter(p=>p!==pid); g.reTeam.push(pid); }
  else if (g.reTeam.length < maxRe) { g.reTeam.push(pid); }
  else { g.kontraTeam.push(pid); }
  // Auto-fill Kontra
  if (g.reTeam.length === maxRe) g.kontraTeam = PIDS.filter(p=>!g.reTeam.includes(p));
  updateGE();
}

function geToggle(key, val) {
  const parts = key.split('.');
  if (parts.length === 2) GE[parts[0]][parts[1]] = val;
  else GE[key] = val;
  // Gezwungene Ansage → auto keine90 for winner
  if (key === 'gezwungen' && val && GE.winner) GE.ansagen[`keine90${GE.winner}`] = true;
  // Armut → auto keine90 Re
  if (GE.spieltyp === 'armut' && GE.winner === 'Re') GE.ansagen.keine90Re = true;
  updateGE();
}

function geValid() {
  const g = GE;
  if (g.spieltyp === 'abbruch') return true;
  if (g.spieltyp === 'falsch') return g.falschBediener !== null;
  const isSolo = SOLOS.includes(g.spieltyp);
  return g.reTeam.length === (isSolo ? 1 : 2) && g.winner !== null;
}

function geSubmit() {
  if (!geValid()) return;
  const ses = getCur();

  if (editingGameId) {
    // Bestehendes Spiel aktualisieren
    const idx = ses.games.findIndex(g => g.id === editingGameId);
    if (idx !== -1) {
      const game = ses.games[idx];
      Object.assign(game, {
        spieltyp: GE.spieltyp, reTeam:[...GE.reTeam], kontraTeam:[...GE.kontraTeam],
        winner: GE.winner, verliererAugen: GE.verliererAugen,
        ansagen:{...GE.ansagen}, sp:{...GE.sp},
        bockMultiplier: GE.bockMultiplier, falschBediener: GE.falschBediener,
        gezwungen: GE.gezwungen,
      });
      game.scores = calcScores(game);
    }
    recalcBockQ(ses);
    recalcDealerIdx(ses);
    editingGameId = null;
  } else {
    // Neues Spiel hinzufügen
    const game = {
      id: Date.now().toString(),
      index: ses.games.length,
      spieltyp: GE.spieltyp, reTeam:[...GE.reTeam], kontraTeam:[...GE.kontraTeam],
      winner: GE.winner, verliererAugen: GE.verliererAugen,
      ansagen:{...GE.ansagen}, sp:{...GE.sp},
      bockMultiplier: GE.bockMultiplier, falschBediener: GE.falschBediener,
      gezwungen: GE.gezwungen, scores:{},
    };
    game.scores = calcScores(game);
    ses.games.push(game);
    checkBockTriggers(ses, game);
    if (!SOLOS.includes(game.spieltyp)) ses.dealerIdx = ((ses.dealerIdx ?? 0) + 1) % 4;
  }

  closeSheet('ge-sheet');
  save(); render();
}

const P_COLORS = {gee:'#007AFF', chrizz:'#FF9500', freed:'#AF52DE', mjd:'#34C759'};

function pieChartSVG(vals, size) {
  const total = PIDS.reduce((s,p) => s + (vals[p]||0), 0);
  if (total === 0) return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-2}" fill="var(--sep)"/></svg>`;
  const r = size/2, cx = r, cy = r;
  let angle = -Math.PI/2;
  const nonZero = PIDS.filter(p => (vals[p]||0) > 0);
  const paths = nonZero.map(p => {
    const v = vals[p];
    const sweep = (v/total) * 2 * Math.PI;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    angle += sweep;
    const x2 = cx + r*Math.cos(angle), y2 = cy + r*Math.sin(angle);
    const large = sweep > Math.PI ? 1 : 0;
    const d = nonZero.length === 1
      ? `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`
      : `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    return `<path d="${d}" fill="${P_COLORS[p]}" stroke="var(--bg)" stroke-width="2"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths.join('')}</svg>`;
}

function renderStats() {
  const settled = S.sessions.filter(s=>s.settled);
  const byYear = {};
  settled.forEach(s => { const y=s.date.slice(0,4); if(!byYear[y])byYear[y]=[]; byYear[y].push(s); });
  const years = Object.keys(byYear).sort().reverse();

  // All-time: kasseBeitrag (€) — einzige durchgängige Metrik für 2009–heute
  const allK = {}; PIDS.forEach(p=>allK[p]=0);
  settled.forEach(s => { PIDS.forEach(p => allK[p] += (s.kasseBeitrag?.[p]||0)); });
  const totalK = PIDS.reduce((s,p)=>s+allK[p],0);

  // Spielpunkte nur aus Abenden mit echten Spielen
  const withGames = settled.filter(s=>(s.games||[]).length>0);
  const allP = {}; PIDS.forEach(p=>allP[p]=0);
  withGames.forEach(s=>{ const t=sessionTotals(s); PIDS.forEach(p=>allP[p]+=(t[p]||0)); });

  const scoreCard = (vals, fmt, unit, n) => PIDS.map(p => {
    const v = vals[p]||0;
    const disp = fmt(v);
    const avg = n > 0 ? fmt(v/n) : fmt(0);
    return `<div class="sb-player">
      <div class="sb-name">${PL[p].s}</div>
      <div style="font-size:${unit==='€'?'20':'22'}px;font-weight:800;font-variant-numeric:tabular-nums;color:${unit==='€'?'var(--green)':v>0?'var(--green)':v<0?'var(--red)':'var(--label2)'}">${disp}</div>
      <div style="font-size:11px;color:var(--label2)">∅ ${avg}/Ab</div>
    </div>`;
  }).join('');

  return `<div>
    <div class="nav">
      <span class="nav-back" onclick="go('home')">‹ Zurück</span>
      <h1>Statistiken</h1>
      <span></span>
    </div>

    <div class="section mt16">
      <div class="section-label">All Time · ${settled.length} Abende · ${fEuro(totalK)} Kasse</div>
      <div class="card">
        <div style="padding:10px 16px 4px;font-size:11px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em">€ Kasse-Beitrag</div>
        <div class="scoreboard" style="padding-top:4px">
          ${scoreCard(allK, v => fEuro(v), '€', settled.length)}
        </div>
        ${withGames.length > 0 ? `<div style="border-top:1px solid var(--sep);padding:10px 16px 4px;font-size:11px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em">Spielpunkte (${withGames.length} Abende)</div>
        <div class="scoreboard" style="padding-top:4px">
          ${scoreCard(allP, v => (v>0?'+':'')+v, 'P', withGames.length)}
        </div>` : ''}
      </div>
    </div>

    ${years.map(yr => {
      const ss = byYear[yr];
      const yk = {}; PIDS.forEach(p=>yk[p]=0);
      ss.forEach(s => PIDS.forEach(p => yk[p]+=(s.kasseBeitrag?.[p]||0)));
      const yK = Object.values(yk).reduce((a,b)=>a+b,0);
      const ssG = ss.filter(s=>(s.games||[]).length>0);
      const yp = {}; PIDS.forEach(p=>yp[p]=0);
      ssG.forEach(s=>{ const t=sessionTotals(s); PIDS.forEach(p=>yp[p]+=(t[p]||0)); });
      return `<div class="section">
        <div class="section-label">${yr} · ${ss.length} Abende · ${fEuro(yK)}</div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:16px;padding:14px 16px">
            <div style="flex-shrink:0">${pieChartSVG(yk, 100)}</div>
            <div style="flex:1;display:flex;flex-direction:column;gap:6px">
              ${PIDS.map(p => {
                const v = yk[p]||0;
                const pct = yK > 0 ? Math.round(v/yK*100) : 0;
                return `<div style="display:flex;align-items:center;gap:8px">
                  <div style="width:10px;height:10px;border-radius:50%;background:${P_COLORS[p]};flex-shrink:0"></div>
                  <div style="flex:1;font-size:13px;font-weight:600;color:var(--label)">${PL[p].s}</div>
                  <div style="font-size:13px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fEuro(v)}</div>
                  <div style="font-size:11px;color:var(--label2);width:30px;text-align:right">${pct}%</div>
                </div>`;
              }).join('')}
            </div>
          </div>
          ${ssG.length > 0 ? `<div style="border-top:1px solid var(--sep);padding:6px 16px 10px">
            <div style="font-size:11px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Spielpunkte</div>
            <div style="display:flex;gap:8px;justify-content:space-around">
              ${PIDS.map(p => { const v=yp[p]||0; return `<div style="text-align:center">
                <div style="font-size:13px;font-weight:700;color:${v>0?'var(--green)':v<0?'var(--red)':'var(--label2)'}">${v>0?'+':''}${v}</div>
                <div style="font-size:10px;color:var(--label2)">${PL[p].s}</div>
              </div>`; }).join('')}
            </div>
          </div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function importSheetHTML() {
  return `<div class="overlay" id="import-sheet" onclick="bgClose(event,'import-sheet')">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Historische Daten importieren</div>
      <div class="f-section">
        <div class="f-hint">CSV mit Spalten: Datum, Gee, Chrizz, Free-D, MJD<br>Datum als TT.MM.JJJJ oder JJJJ-MM-TT. Diese Werte sind bereits die €-Kassen-Beiträge pro Spieler.</div>
        <textarea id="imp-csv" style="width:100%;height:180px;padding:12px;border:1.5px solid var(--sep);border-radius:var(--r-sm);font-family:monospace;font-size:12px;background:var(--surface);color:var(--label);resize:vertical;margin-top:12px" placeholder="16.05.2009,5,2,0,2&#10;20.05.2009,5,5,0,5&#10;..."></textarea>
        <button class="btn btn-primary btn-full mt12" onclick="doImport()">Importieren</button>
      </div>
    </div>
  </div>`;
}

function doImport() {
  const raw = document.getElementById('imp-csv').value.trim();
  const lines = raw.split('\n').filter(l=>l.trim());
  let count = 0;
  lines.forEach(line => {
    const parts = line.split(/[,;\t]/).map(s=>s.trim().replace(',','.'));
    if (parts.length < 5) return;
    const [ds, ...sc] = parts;
    if (!ds || /datum|date/i.test(ds)) return;
    let date = ds;
    if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(ds)) {
      const [d,m,y] = ds.split('.');
      date = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    const kb = {}; PIDS.forEach((p,i) => kb[p] = parseFloat(sc[i])||0);
    const id = `imp-${date}`;
    if (S.sessions.find(s=>s.id===id)) return;
    const ses = {id, date, seatOrder:[...PIDS], games:[], bockQ:[], settled:true, kasseBeitrag:kb, imported:true};
    S.sessions.push(ses);
    S.kasseSaldo += Object.values(kb).reduce((a,b)=>a+b,0);
    count++;
  });
  save();
  closeSheet('import-sheet');
  alert(`${count} Abende importiert.`);
  render();
}

const today = () => new Date().toISOString().slice(0,10);

function fDate(iso) {
  if (!iso) return '';
  try { return new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return iso; }
}
function fDateShort(iso) {
  if (!iso) return '';
  try { return new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return iso; }
}
function fEuro(v) {
  if (v==null) return '0 €';
  return Math.round(v).toLocaleString('de-DE') + ' €';
}

function seedHistory() {
  const key = 'doko-seeded-v2';
  if (localStorage.getItem(key)) return;
  const seedMap = {};
  HISTORY_SEED.forEach(s => seedMap[s.id] = s);
  let kasseDiff = 0;
  // Patch existing imported sessions that have wrong/missing kasseBeitrag
  S.sessions.forEach(s => {
    if (s.imported && seedMap[s.id]) {
      const oldSum = Object.values(s.kasseBeitrag || {}).reduce((a,b)=>a+b, 0);
      const newKB = seedMap[s.id].kasseBeitrag;
      const newSum = Object.values(newKB).reduce((a,b)=>a+b, 0);
      s.kasseBeitrag = newKB;
      kasseDiff += newSum - oldSum;
    }
  });
  // Add sessions not yet in localStorage
  HISTORY_SEED.forEach(ses => {
    if (!S.sessions.find(s => s.id === ses.id)) {
      S.sessions.push(ses);
      kasseDiff += Object.values(ses.kasseBeitrag).reduce((a,b)=>a+b, 0);
    }
  });
  S.kasseSaldo += kasseDiff;
  save();
  localStorage.setItem(key, '1');
}

seedHistory();
render();
